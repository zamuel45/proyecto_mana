# Nginx de Maná: un solo puerto para la PWA, la API (PostgREST), la autenticación (GoTrue),
# el servicio Node y el tiempo real. En el VPS, delante de este se pone HTTPS con Certbot
# (ver deploy/nginx-vps.conf).
map $http_upgrade $connection_upgrade {
  default upgrade;
  ''      close;
}

server {
  listen 80;
  server_name _;
  client_max_body_size 4m;

  # API REST automática sobre PostgreSQL (respeta Row Level Security)
  location /rest/v1/ {
    proxy_pass http://rest:3000/;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
  }

  # GoTrue NO se publica: el inicio de sesión pasa por /servicio/login, que aplica el bloqueo por
  # intentos fallidos y valida restaurante activo y turno antes de entregar el JWT de GoTrue.

  # Servicio Node: inicio de sesión, alta de restaurantes/empleados e imágenes
  location /servicio/ {
    proxy_pass http://servicio:3001;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Real-IP $remote_addr;
  }

  # Tiempo real (Socket.io / WebSocket)
  location /socket.io/ {
    proxy_pass http://servicio:3001;
    proxy_http_version 1.1;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection $connection_upgrade;
    proxy_set_header Host $host;
    proxy_read_timeout 120s;
  }

  # Imágenes de los platos
  location /uploads/ {
    alias /srv/uploads/;
    expires 7d;
    add_header X-Content-Type-Options nosniff;
  }

  # PWA compilada (carpeta app/)
  location / {
    root /srv/app;
    try_files $uri $uri/ /index.html;
    location = /sw.js { add_header Cache-Control "no-cache"; }
    location = /index.html { add_header Cache-Control "no-cache"; }
  }
}
