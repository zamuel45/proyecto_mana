# =====================================================================
#  Nginx del VPS (Ubuntu) — HTTPS con Certbot delante de docker compose
#
#  1. En el .env del VPS:  PUERTO_WEB=127.0.0.1:8080   (Docker NO debe publicar el puerto a internet:
#     Docker se salta las reglas de ufw si el puerto se publica en 0.0.0.0)
#  2. sudo cp deploy/nginx-vps.conf /etc/nginx/sites-available/mana
#     (cambia manarestaurantes.com por tu dominio)
#     sudo ln -s /etc/nginx/sites-available/mana /etc/nginx/sites-enabled/ && sudo nginx -t && sudo systemctl reload nginx
#  3. sudo certbot --nginx -d manarestaurantes.com     (agrega el bloque 443 y renueva solo)
# =====================================================================
map $http_upgrade $connection_upgrade {
  default upgrade;
  ''      close;
}

server {
  listen 80;
  server_name manarestaurantes.com;
  client_max_body_size 4m;

  location / {
    proxy_pass http://127.0.0.1:8080;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $remote_addr;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header Upgrade $http_upgrade;          # WebSocket (tiempo real)
    proxy_set_header Connection $connection_upgrade;
    proxy_read_timeout 120s;
  }
}
