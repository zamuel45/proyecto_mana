# =====================================================================
#  MANÁ — infraestructura completa (la misma en el PC de desarrollo y en el VPS)
#
#   db        PostgreSQL 16 con Row Level Security (aislamiento entre restaurantes)
#   auth      GoTrue: inicio de sesión y emisión de los JWT (restaurant_id + rol)
#   rest      PostgREST: API REST automática sobre PostgreSQL (respeta RLS)
#   servicio  Node.js + Socket.io: tiempo real, turnos cada minuto, correos,
#             alta de restaurantes y empleados (API de administración de GoTrue)
#   web       Nginx: sirve la PWA (carpeta app/) y publica todo bajo un solo puerto
#
#  Uso:  docker compose up -d        → abre http://localhost:8080
#        docker compose logs -f servicio
#  Las variables secretas están en el archivo .env (copia de .env.example).
# =====================================================================
name: mana

services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: mana
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      AUTHENTICATOR_PASSWORD: ${AUTHENTICATOR_PASSWORD}
      AUTH_DB_PASSWORD: ${AUTH_DB_PASSWORD}
      SERVICIO_DB_PASSWORD: ${SERVICIO_DB_PASSWORD}
      TZ: America/Bogota
      PGTZ: America/Bogota
    volumes:
      - datos_postgres:/var/lib/postgresql/data
      - ./docker/db:/docker-entrypoint-initdb.d:ro
    ports:
      - "127.0.0.1:${PUERTO_POSTGRES:-5432}:5432"   # solo este equipo (pgAdmin); nunca expuesto a la red
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d mana"]
      interval: 5s
      timeout: 5s
      retries: 20

  auth:
    image: supabase/gotrue:v2.170.0
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      GOTRUE_API_HOST: 0.0.0.0
      PORT: 9999
      API_EXTERNAL_URL: ${URL_PUBLICA}/auth/v1
      GOTRUE_SITE_URL: ${URL_PUBLICA}
      GOTRUE_DB_DRIVER: postgres
      GOTRUE_DB_DATABASE_URL: postgres://supabase_auth_admin:${AUTH_DB_PASSWORD}@db:5432/mana?search_path=auth
      GOTRUE_JWT_SECRET: ${JWT_SECRET}
      GOTRUE_JWT_EXP: ${JWT_DURACION_SEGUNDOS:-43200}
      GOTRUE_JWT_AUD: authenticated
      GOTRUE_JWT_ADMIN_ROLES: service_role
      GOTRUE_DISABLE_SIGNUP: "true"            # nadie se registra solo: las cuentas las crea Maná o el administrador
      GOTRUE_EXTERNAL_EMAIL_ENABLED: "true"
      GOTRUE_MAILER_AUTOCONFIRM: "true"
      GOTRUE_PASSWORD_MIN_LENGTH: 8
      GOTRUE_RATE_LIMIT_TOKEN_REFRESH: 1000
      GOTRUE_LOG_LEVEL: warn

  rest:
    image: postgrest/postgrest:v12.2.3
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      PGRST_DB_URI: postgres://authenticator:${AUTHENTICATOR_PASSWORD}@db:5432/mana
      PGRST_DB_SCHEMAS: api,public           # api = funciones del sistema (/rpc), public = tablas (con RLS)
      PGRST_DB_ANON_ROLE: anon
      PGRST_JWT_SECRET: ${JWT_SECRET}
      PGRST_DB_PRE_REQUEST: app.antes_de_peticion
      PGRST_DB_MAX_ROWS: 1000
      PGRST_LOG_LEVEL: warn

  servicio:
    image: node:22-alpine
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
      auth:
        condition: service_started
    working_dir: /srv/realtime
    command: sh -c "npm install --omit=dev --no-audit --no-fund && node servidor.js"
    environment:
      TZ: America/Bogota
      PUERTO: 3001
      DATABASE_URL: postgres://mana_servicio:${SERVICIO_DB_PASSWORD}@db:5432/mana
      MIGRACIONES_DATABASE_URL: postgres://postgres:${POSTGRES_PASSWORD}@db:5432/mana
      GOTRUE_URL: http://auth:9999
      JWT_SECRET: ${JWT_SECRET}
      RESEND_API_KEY: ${RESEND_API_KEY:-}
      CORREO_REMITENTE: ${CORREO_REMITENTE:-Maná <onboarding@resend.dev>}
      URL_PUBLICA: ${URL_PUBLICA}
      SUPERADMIN_EMAIL: ${SUPERADMIN_EMAIL:-super@mana.co}
      SUPERADMIN_PASSWORD: ${SUPERADMIN_PASSWORD:-}
      SEMILLA_DEMO: ${SEMILLA_DEMO:-0}
    volumes:
      - ./realtime:/srv/realtime
      - ./database:/srv/database:ro
      - ./uploads:/srv/uploads

  web:
    image: nginx:1.27-alpine
    restart: unless-stopped
    depends_on: [rest, auth, servicio]
    ports:
      - "${PUERTO_WEB:-8080}:80"
    volumes:
      - ./docker/nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
      - ./app:/srv/app:ro
      - ./uploads:/srv/uploads:ro

volumes:
  datos_postgres:
